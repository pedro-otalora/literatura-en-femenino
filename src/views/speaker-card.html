<li class="speaker-grid__item">
  <article class="card speaker-card">
    <div class="speaker-card__media frame">
      <img
        class="frame__image"
        src="./assets/images/{{ photo }}?width=480"
        alt=""
        width="480"
        height="600"
        loading="lazy"
      />
    </div>
    <div class="card-body speaker-card__body">
      <h2 class="card-title speaker-card__name">{{ name }}</h2>
      <p class="speaker-card__role">{{ role }}</p>
      <p class="card-text">{{ summary }}</p>
      <button type="button" class="btn btn-outline-primary btn-sm stretched-link" data-bs-toggle="modal" data-bs-target="#speaker-modal">
        Leer biografía<span class="visually-hidden"> de {{ name }}</span>
      </button>
      <template class="speaker-card__bio">
        <p>{{ bio }}</p>
      </template>
    </div>
  </article>
</li>
