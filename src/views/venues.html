 pasa a tres columnas o se queda en una según el ancho de su sección (container query) -->

  <li class="venues__item" data-venue="plaza">

      Inauguración y charlas del viernes

  <li class="venues__item" data-venue="biblioteca">

  <li class="venues__item" data-venue="jardin">
