<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
    <!-- do not remove this line! -->
    <title>Portada</title>
  </head>
  <body>
    <include src="./views/header.html" locals='{"page": "home"}'></include>
    <main id="main" class="container">
      <section class="poster" aria-labelledby="poster-title">
        <div class="poster__sun" aria-hidden="true"></div>
        <img
          class="poster__image"
          src="./assets/images/portada.jpg?width=1200"
          srcset="
            ./assets/images/portada.jpg?width=600   600w,
            ./assets/images/portada.jpg?width=1200 1200w
          "
          sizes="(min-width: 768px) 65vw, 100vw"
          alt="[describe la foto que elijas]"
        />
        <h1 class="poster__title" id="poster-title">
          Páginas <span class="poster__title-line">al Sol</span>
        </h1>
        <p class="poster__subtitle">Jornadas y concurso literario</p>
        <p class="poster__date">
          <time datetime="2027-06-18">18</time> al
          <time datetime="2027-06-20">20 de junio de 2027</time>
        </p>
        <p class="poster__text">
          Charlas con autores, talleres de escritura y un concurso abierto a
          todas las edades.
        </p>
        <ul class="poster__links" role="list">
          <li>
            <a class="btn btn-primary btn-lg" href="./programa.html"
              >Ver programa</a
            >
          </li>
          <li>
            <a class="btn btn-outline-secondary btn-lg" href="./ponentes.html"
              >Conoce a los ponentes</a
            >
          </li>
        </ul>
      </section>
    </main>
    <include src="./views/footer.html"></include>
    <script type="module" src="./assets/scripts/main.js"></script>
    <!-- do not remove this line! -->
  </body>
</html>
