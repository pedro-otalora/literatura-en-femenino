<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
    <!-- do not remove this line! -->
    <title>Portada</title>
  </head>
  <body>
    <include src="./views/header.html" locals='{"page": "home"}'></include>
    <main id="main">
      <section class="poster" aria-labelledby="poster-title">
        <div class="poster__heading container">
          <p class="poster__kicker">
            Jornadas y concurso literario <br>
            <time datetime="2027-06-18">18</time> al
            <time datetime="2027-06-20">20 de junio de 2027</time>
          </p>
          <h1 class="poster__title" id="poster-title">
            Literatura <span class="poster__title-line">en femenino</span>
          </h1>
        </div>
        <div class="poster__media frame">
          <img
            class="frame__image"
            src="./assets/images/portada.jpg?width=1600"
            srcset="
              ./assets/images/portada.jpg?width=800   800w,
              ./assets/images/portada.jpg?width=1600 1600w
            "
            sizes="100vw"
            alt="[describe la foto]"
          />
        </div>
        <div class="poster__body container">
          <p class="poster__typed">
            <span class="visually-hidden"
              >Tres días para recordar a las escritoras que firmaron como
              hombres, a las Sinsombrero y a las que faltan en los libros.</span
            >
            <span aria-hidden="true"
              >Tres días para recordar a
              <span class="poster__typed-text" id="typed"
                >las que faltan en los libros</span
              ></span
            >
          </p>
          <ul class="poster__links" role="list">
            <li class="poster__links-item">
              <a
                class="btn btn-primary btn-lg poster__button"
                href="./programa.html"
                >Ver programa</a
              >
            </li>
            <li class="poster__links-item">
              <a
                class="btn btn-outline-secondary btn-lg poster__button poster__button--light"
                href="./ponentes.html"
                >Conoce a las ponentes</a
              >
            </li>
          </ul>
        </div>
      </section>
    </main>
    <include src="./views/footer.html"></include>
    <script type="module" src="./assets/scripts/main.js"></script>
    <!-- do not remove this line! -->
  </body>
</html>
