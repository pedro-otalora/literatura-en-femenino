<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
    <!-- do not remove this line! -->
    <title>Ponentes · Literatura en femenino</title>
    <meta
      name="description"
      content="Seis historiadoras, novelistas, poetas e ilustradoras hablan de seudónimos, géneros literarios, derechos de la mujer, activismo y Wikipedia."
    />
  </head>
  <body>
    <include src="./views/header.html" locals='{"page": "ponentes"}'></include>
    <main id="main">
      <header class="page-hero">
        <img
          class="page-hero__image"
          src="./assets/images/articulo-1.jpg?width=1600"
          srcset="
            ./assets/images/articulo-1.jpg?width=800   800w,
            ./assets/images/articulo-1.jpg?width=1600 1600w
          "
          sizes="100vw"
          alt=""
        />
        <div class="page-hero__content container">
          <p class="page-hero__kicker">Ponentes</p>
          <h1 class="page-hero__title">
            Seis voces para leer la literatura escrita por mujeres
          </h1>
          <p class="page-hero__text">
            Historiadoras, novelistas, editoras e ilustradoras hablan de
            géneros, derechos, activismo y de las autoras que el canon dejó
            fuera.
          </p>
        </div>
      </header>
      <div class="container">
        <ul class="speaker-grid" role="list">
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Lucía Ferrer", "role": "Historiadora de la literatura", "photo": "ponente-1.jpg", "summary": "Firmar con nombre de hombre: seudónimos y autoras invisibilizadas.", "bio": "Lucía Ferrer investiga la escritura de mujeres en los siglos XIX y XX. En su charla explicará por qué Cecilia Böhl de Faber publicó como Fernán Caballero, cómo María Lejárraga escribió obras que firmó su marido y por qué las Sinsombrero desaparecieron de los manuales de la Generación del 27."}'
          ></include>
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Inés Garrido", "role": "Novelista y crítica", "photo": "ponente-2.jpg", "summary": "Asesinas, detectives y amantes: las grandes autoras de cada género.", "bio": "Inés Garrido escribe novela negra y reseñas en prensa cultural. Recorrerá los géneros populares de la mano de sus autoras, del misterio de Agatha Christie y Patricia Highsmith a la novela romántica de Jane Austen y la ciencia ficción de Mary Shelley y Ursula K. Le Guin, y explicará por qué se consideraron géneros menores cuando los escribían mujeres."}'
          ></include>
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Carmen Ruiz", "role": "Documentalista y wikipedista", "photo": "ponente-3.jpg", "summary": "Taller Editatona: escribir en Wikipedia con perspectiva de género.", "bio": "Carmen Ruiz coordina editatonas, encuentros para crear y mejorar artículos de Wikipedia. En el taller enseñará a editar paso a paso, a buscar fuentes fiables y a revisar un artículo con perspectiva de género, y cada participante trabajará en la biografía de una escritora. No hace falta experiencia previa, solo un portátil."}'
          ></include>
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Teresa Valcárcel", "role": "Historiadora", "photo": "ponente-4.jpg", "summary": "De Wollstonecraft a Campoamor: los derechos de la mujer en los libros.", "bio": "Teresa Valcárcel está especializada en la historia del sufragismo. En su charla seguirá la conquista de los derechos de las mujeres a través de los textos que la impulsaron, de la Vindicación de los derechos de la mujer de Mary Wollstonecraft a los discursos de Clara Campoamor, pasando por Concepción Arenal y Emilia Pardo Bazán."}'
          ></include>
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Elena Navarro", "role": "Ilustradora", "photo": "ponente-5.jpg", "summary": "Taller familiar: dibuja a tu escritora.", "bio": "Elena Navarro ilustra álbumes y libros de divulgación infantil. En este taller para familias con niñas y niños a partir de 6 años, cada familia elegirá una escritora y creará su biografía ilustrada en formato álbum."}'
          ></include>
          <include
            src="./views/speaker-card.html"
            locals='{"name": "Marta Ibáñez", "role": "Poeta", "photo": "ponente-6.jpg", "summary": "Escribir para cambiar el mundo: activismo feminista y LGTBI en la literatura.", "bio": "Marta Ibáñez ha publicado tres poemarios. Hablará de la literatura como herramienta de lucha, de Una habitación propia y Orlando de Virginia Woolf a la poesía de Audre Lorde y Gloria Fuertes, y de las voces actuales que escriben desde el feminismo y la diversidad."}'
          ></include>
        </ul>

        <!-- Una sola ventana modal para las seis biografías: el contenido lo pone main.js al abrirla -->
        <div
          class="modal fade"
          id="speaker-modal"
          tabindex="-1"
          aria-labelledby="speaker-modal-title"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="modal-title fs-4" id="speaker-modal-title"></h2>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar"
                ></button>
              </div>
              <div class="modal-body"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <include src="./views/footer.html"></include>
    <script type="module" src="./assets/scripts/main.js"></script>
    <!-- do not remove this line! -->
  </body>
</html>
