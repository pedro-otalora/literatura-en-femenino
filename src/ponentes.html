<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />
    <!-- do not remove this line! -->
    <title>Ponentes</title>
  </head>
  <body>
    <include src="./views/header.html" locals='{"page": "ponentes"}'></include>
    <main id="main" class="container">
      <header class="page-intro">
        <h1 class="page-intro__title">Ponentes</h1>
        <p class="page-intro__text">
          Seis voces de la literatura actual compartirán su oficio en charlas y
          talleres.
        </p>
      </header>

      <ul class="speaker-grid" role="list">
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Lucía Ferrer", "role": "Novelista", "photo": "ponente-1.jpg", "summary": "Autora de tres novelas sobre la memoria de los pueblos del litoral.", "bio": "Lucía Ferrer creció en un pueblo de pescadores y ha convertido esa infancia en el centro de su obra. Su novela «La sal en las manos» recibió el Premio de Narrativa Costa Mediterránea. En las jornadas hablará de cómo transformar los recuerdos familiares en ficción."}'
        ></include>
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Andrés Molina", "role": "Poeta", "photo": "ponente-2.jpg", "summary": "Poesía breve y cotidiana, entre el papel y las redes sociales.", "bio": "Andrés Molina publica poesía desde los veinte años y ha reunido sus poemas en cuatro libros, el último «Lo que cabe en una taza». Combina los recitales en bibliotecas con la difusión en redes. Dirigirá un taller sobre cómo empezar a escribir poesía a partir de lo cotidiano."}'
        ></include>
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Carmen Ruiz", "role": "Editora", "photo": "ponente-3.jpg", "summary": "Fundadora de una pequeña editorial independiente de narrativa.", "bio": "Carmen Ruiz trabajó durante quince años en grandes grupos editoriales antes de fundar su propio sello, especializado en primeras novelas. En su charla explicará qué busca un editor en un manuscrito y cómo preparar un envío para tener más posibilidades."}'
        ></include>
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Javier Soler", "role": "Guionista", "photo": "ponente-4.jpg", "summary": "Guionista de series y adaptador de novelas a la pantalla.", "bio": "Javier Soler ha escrito guiones para televisión y ha adaptado dos novelas al formato de serie. En las jornadas mostrará qué se pierde y qué se gana al llevar un libro a la pantalla, con ejemplos de sus propios trabajos."}'
        ></include>
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Elena Navarro", "role": "Ilustradora", "photo": "ponente-5.jpg", "summary": "Ilustradora y autora de álbumes ilustrados para todas las edades.", "bio": "Elena Navarro ha ilustrado más de veinte libros infantiles y es autora de «El faro que no dormía», escrito e ilustrado por ella. Impartirá un taller familiar en el que texto e imagen se crean a la vez."}'
        ></include>
        <include
          src="./views/speaker-card.html"
          locals='{"name": "Marta Ibáñez", "role": "Crítica literaria", "photo": "ponente-6.jpg", "summary": "Crítica en prensa y presentadora de un pódcast de libros.", "bio": "Marta Ibáñez escribe reseñas en un suplemento cultural y presenta un pódcast semanal sobre novedades editoriales. Será la presidenta del jurado del concurso literario y explicará qué criterios se tendrán en cuenta al valorar los textos."}'
        ></include>
      </ul>

      <!-- Una sola ventana modal para las seis biografías: el contenido lo pone main.js al abrirla -->
      <div
        class="modal fade"
        id="speaker-modal"
        tabindex="-1"
        aria-labelledby="speaker-modal-title"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title fs-4" id="speaker-modal-title"></h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body"></div>
          </div>
        </div>
      </div>
    </main>
    <include src="./views/footer.html"></include>
    <script type="module" src="./assets/scripts/main.js"></script>
    <!-- do not remove this line! -->
  </body>
</html>
